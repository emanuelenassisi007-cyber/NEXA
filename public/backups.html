<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Backups</title>
    <link rel="stylesheet" href="style.css" />
    <script>
      const savedTheme = localStorage.getItem("theme");

      if (savedTheme === "dark") {
        document.documentElement.classList.add("dark-mode");
      }
    </script>
    <script
      src="https://kit.fontawesome.com/be6af1d745.js"
      crossorigin="anonymous"
    ></script>
    <style>
      .temp {
        display: flex;
        flex-direction: row;
        gap: 10px;
        padding: 4px;
        border: 1px solid var(--border-secondary);
        border-radius: 8px;
        background-color: var(--surface-color);
      }

      .temp > span {
        cursor: pointer;
        padding: 8px 4px;
        border-radius: 8px;
        color: var(--text-secondary);
        transition:
          background-color 0.2s ease,
          color 0.2s ease;
      }

      .temp > span:hover {
        color: var(--text-color);
        background-color: var(--surface-secondary);
      }

      .chart-container {
        position: relative;
        width: 100%;
        height: 300px;
      }

      .temp > span.activeFilter {
        background-color: var(--surface-secondary);
        color: var(--text-color);
        font-weight: 600;
      }
    </style>
  </head>
  <body style="flex-direction: row; align-items: start; justify-content: start">
    <div class="menu">
      <div
        style="
          display: flex;
          flex-direction: row;
          gap: 10px;
          align-items: center;
          margin-bottom: 30px;
        "
      >
        <div style="display: flex; flex-direction: column">
          <div class="logo"></div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 5px">
          <span class="title" style="font-size: 14px">Nexa</span>
          <span class="subtitle-form" style="font-size: 10px"
            >Business Management System</span
          >
        </div>
      </div>
      <div
        style="
          display: flex;
          flex-direction: column;
          justify-content: space-between;
          height: calc(100vh - 100px);
          box-sizing: border-box;
        "
      >
        <div>
          <a class="link" href="dashboard.html">
            <i class="fa-solid fa-chart-bar" style="color: #686868"></i>
            <span>Dashboard</span>
          </a>
          <a class="link" href="customers.html">
            <i class="fa-solid fa-users" style="color: #686868"></i>
            <span>Customers</span>
          </a>
          <a class="link" href="products.html">
            <i class="fa-solid fa-box-open" style="color: #686868"></i>
            <span>Products & Services</span>
          </a>
          <a class="link" href="orders.html">
            <i class="fa-solid fa-cart-shopping" style="color: #686868"></i>
            <span>Orders</span>
          </a>
          <a class="link" href="appointments.html">
            <i class="fa-solid fa-calendar" style="color: #686868"></i>
            <span>Appointments</span>
          </a>
          <a class="link" href="users.html">
            <i class="fa-regular fa-user" style="color: #686868"></i>
            <span>Users</span>
          </a>
        </div>
        <div>
          <hr
            style="
              border: none;
              height: 0.1px;
              background-color: rgb(225, 225, 230);
            "
          />
          <a class="link" href="notifications.html">
            <i class="fa-solid fa-bell" style="color: #686868"></i>
            <span>Notifications</span>
          </a>
          <a class="link" id="active" href="settings.html">
            <i class="fa-solid fa-gear" style="color: #686868"></i>
            <span>Settings</span>
          </a>
          <a class="link" href="help.html">
            <i class="fa-solid fa-circle-question" style="color: #686868"></i>
            <span>Help</span>
          </a>
          <a class="link" href="logout.html">
            <i
              class="fa-solid fa-right-from-bracket"
              style="color: #686868"
            ></i>
            <span>Logout</span>
          </a>
        </div>
      </div>
    </div>
    <div class="home">
      <div
        style="
          padding: 20px 30px;
          display: flex;
          justify-content: space-between;
          border-bottom: #686868;
        "
      >
        <div style="display: flex; flex-direction: column; gap: 8px">
          <span id="current_section"></span>
          <span id="navigation"></span>
        </div>
        <div
          style="
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 10px;
          "
        >
          <div class="theme-toggle" id="themeToggle" style="cursor: pointer">
            <i class="fa-regular fa-moon" style="color: var(--text-color)"></i>
          </div>
          <div class="notification-container">
            <button id="notification-btn" class="bell-button">
              <i
                class="fa-regular fa-bell"
                style="color: var(--text-color)"
              ></i>
              <span id="notification-badge" class="badge">0</span>
            </button>

            <div id="notification-dropdown" class="notification-dropdown">
              <div class="dropdown-header">
                <span style="font-size: 14px; font-weight: bold"
                  >Notifiche</span
                >
                <span
                  style="font-size: 12px; font-weight: normal; cursor: pointer"
                  id="readAll"
                  >Leggi tutto</span
                >
              </div>
              <ul id="notification-list" class="dropdown-list">
                <li class="empty-message">Nessuna nuova notifica</li>
              </ul>
            </div>
          </div>
          <div class="profile">
            <span id="name"></span>
            <span id="surname"></span>
          </div>
        </div>
      </div>
      <hr
        style="
          border: none;
          height: 0.1px;
          background-color: rgb(225, 225, 230);
        "
      />
      <div
        class="container-error"
        style="width: 98%; margin: 20px; margin-bottom: 0px"
      >
        <i class="fa-solid fa-lock" style="size: 25px"></i>
        <span id="error-form"></span>
      </div>
      <div class="customer">
        <div
          style="
            padding: 40px, 0px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: #686868;
          "
        >
          <div style="display: flex; flex-direction: column; gap: 10px">
            <span style="font-size: 25px">Backups</span>
            <span style="font-size: 14px; color: grey"
              >Select the backup to import to restore your data.</span
            >
          </div>
        </div>
        <div
          style="
            display: flex;
            flex-direction: row;
            align-items: center;
            margin-top: 25px;
            width: 100%;
          "
        >
          <div class="search-customer">
            <i
              class="fa-solid fa-magnifying-glass"
              style="color: rgb(168, 166, 166)"
            ></i>
            <input
              type="search"
              placeholder="Search backup..."
              id="search-input"
            />
          </div>
          <button id="clear-filters">Clear Filters</button>
        </div>
        <div class="box-customers">
          <div
            style="
              display: flex;
              flex-direction: row;
              justify-content: space-between;
              align-items: center;
            "
          >
            <span style="font-size: 14px; font-weight: bold">All Backups </span>
            <a
              style="
                display: flex;
                flex-direction: row;
                align-items: center;
                gap: 10px;
                text-decoration: none;
              "
              href="orders.html"
            >
            </a>
          </div>
          <hr
            style="
              border: none;
              height: 0.1px;
              background-color: rgb(225, 225, 230);
            "
          />
          <div
            style="
              display: flex;
              flex-direction: row;
              justify-content: space-between;
              align-items: center;
              margin: 1px 10px;
            "
          >
            <span style="font-size: 12px; color: grey">ID</span>
            <span style="font-size: 12px; color: grey">Backup</span>
            <span style="font-size: 12px; color: grey">Date</span>
            <span style="font-size: 12px; color: grey">Size (MB)</span>
            <span style="font-size: 12px; color: grey">Type</span>
            <span style="font-size: 12px; color: grey">Import </span>
            <span style="font-size: 12px; color: grey">Exports</span>
          </div>
          <hr
            style="
              border: none;
              height: 0.1px;
              background-color: rgb(225, 225, 230);
            "
          />
          <div id="backups" class="protected-data"></div>
        </div>
        <div id="pagination"></div>
      </div>
    </div>
    <script src="../public/config.js"></script>
    <script src="http://localhost:3000/socket.io/socket.io.js"></script>
    <script src="backups_script.js"></script>
  </body>
</html>
