<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <link rel="stylesheet" href="style.css" />
    <title>Create new personal password</title>
    <style>
      .subtitle-form {
        font-weight: normal;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 11px;
        color: grey;
      }
    </style>
  </head>
  <body>
    <div class="container-error">
      <img
        src="images/circle-exclamation-solid.png"
        alt="Warning"
        width="25px"
      />
      <span id="error-text"></span>
    </div>
    <div class="container">
      <div
        style="
          display: flex;
          flex-direction: row;
          gap: 10px;
          align-items: center;
          margin-bottom: 30px;
        "
      >
        <div style="display: flex; flex-direction: column">
          <div class="logo"></div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 5px">
          <span class="title">Nexa</span>
          <span class="subtitle-form">Business Management System</span>
        </div>
      </div>
      <span
        class="title"
        style="font-size: 25px; font-weight: normal; margin-bottom: 10px"
        >Create password</span
      >
      <span class="subtitle" style="font-weight: normal"
        >Create a personal password to access the management area.</span
      >
      <form id="form">
        <span class="subtitle-form">Email</span>
        <input
          type="email"
          required
          placeholder="mariorossi@example.com"
          id="email"
        />
        <span id="email-error" style="color: red; display: none"></span>
        <span class="subtitle-form">Temporary password</span>
        <input
          type="text"
          maxlength="10"
          required
          placeholder="•••••••"
          id="temp"
        />
        <span id="temp-error" style="color: red; display: none"></span>
        <span class="subtitle-form">New password</span>
        <input type="password" required placeholder="•••••••" id="password" />
        <span id="password-error" style="color: red; display: none"></span>
        <span class="subtitle-form">Confirm password</span>
        <input type="password" required placeholder="•••••••" id="password2" />
        <span id="confirm-error" style="color: red; display: none"></span>
      </form>
      <button class="login" id="login">Create password</button>
    </div>
  </body>
  <script src="../public/config.js"></script>
  <script>
    const password = document.getElementById("password");
    const confirm = document.getElementById("password2");
    const login = document.getElementById("login");
    const password_error = document.getElementById("password-error");
    const confirm_error = document.getElementById("confirm-error");
    const email_error = document.getElementById("email-error");
    const container_error = document.querySelector(".container-error");
    const error_text = document.getElementById("error-text");
    const passwordTemp = document.getElementById("temp");
    const email = document.getElementById("email");

    const regex =
      /^[a-zA-Z0-9.!#\$%&'*+/=?^_{|}~-]+@[a-zA-Z0-9-]+(?:\.[a-zA-Z0-9-]+)*$/;

    function validaEmail() {
      const value = email.value.trim();

      if (value === "") {
        email_error.textContent = "Il campo email non può essere vuoto.";
        email_error.style.display = "block";
        return false;
      } else if (!regex.test(value)) {
        email_error.textContent =
          "Inserisci un indirizzo email valido (es. you@company.com).";
        email_error.style.display = "block";
        return false;
      } else {
        email_error.textContent = "";
        email_error.style.display = "none";
        return true;
      }
    }
    function validaPassword() {
      const passwordValue = password.value.trim();

      if (passwordValue.length < 8) {
        password_error.textContent =
          "La password deve contenere almeno 8 caratteri.";
        password_error.style.display = "block";
        return false;
      }
      if (!/[A-Z]/.test(passwordValue)) {
        password_error.textContent =
          "La password deve contenere almeno una letter maiuscola.";
        password_error.style.display = "block";
        return false;
      }
      if (!/[a-z]/.test(passwordValue)) {
        password_error.textContent =
          "La password deve contenere almeno una lettera minuscola.";
        password_error.style.display = "block";
        return false;
      }
      if (!/\d/.test(passwordValue)) {
        password_error.textContent =
          "La password deve contenere almeno un numero.";
        password_error.style.display = "block";
        return false;
      }
      if (!/[!@#$%^&*()_+=\-[\]{};':",./?]/.test(passwordValue)) {
        password_error.textContent =
          "La password deve contenere almeno un carattere speciale (es. !@#$).";
        password_error.style.display = "block";
        return false;
      }

      password_error.textContent = "";
      password_error.style.display = "none";
      return true;
    }
    function validaConferma() {
      if (confirm.value.trim() !== password.value.trim()) {
        confirm_error.textContent = "Le due password non sono uguali.";
        confirm_error.style.display = "block";
        return false;
      } else {
        confirm_error.textContent = "";
        confirm_error.style.display = "none";
        return true;
      }
    }

    async function validaPasswordTemp() {
      const response = await fetch(`${API_URL}/api/auth/comparePassword`);
      if (!response.ok) return;

      const data = await response.json();
    }

    password.addEventListener("input", validaPassword);
    confirm.addEventListener("input", validaConferma);
    email.addEventListener("input", validaEmail);

    container_error.classList.remove("active");
    container_error.classList.remove("success");
    error_text.textContent = "";

    login.addEventListener("click", async (e) => {
      e.preventDefault();

      if (
        !password.value.trim() ||
        !confirm.value.trim() ||
        !passwordTemp.value.trim() ||
        !email.value.trim()
      ) {
        container_error.classList.add("active");
        error_text.textContent = "I campi sono obbligatori";
        return;
      }

      const isPasswordValida = validaPassword();
      const isConfermaValida = validaConferma();
      const isEmailValida = validaEmail();

      if (!isPasswordValida || !isConfermaValida || !isEmailValida) {
        container_error.classList.add("active");
        error_text.textContent = "Correggi gli errori prima di inviare";
        return;
      }

      try {
        const compareResponse = await fetch(
          `${API_URL}/api/auth/comparePassword`,
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              password: passwordTemp.value.trim(),
              email: email.value.trim(),
            }),
          },
        );

        const compareData = await compareResponse.json();

        if (!compareResponse.ok) {
          throw new Error(
            compareData.message || "Password temporanea non valida",
          );
        }

        const resetResponse = await fetch(
          `${API_URL}/api/auth/reset-password`,
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              password: password.value.trim(),
              email: email.value.trim(),
            }),
          },
        );

        const resetData = await resetResponse.json();

        if (!resetResponse.ok) {
          throw new Error(
            resetData.message || "Errore durante il cambio password",
          );
        }

        window.location.href = "/public/confirmed-password.html";
      } catch (error) {
        console.error("Si è verificato un problema:", error);

        container_error.classList.add("active");
        error_text.textContent = error.message;
      }
    });
  </script>
</html>
