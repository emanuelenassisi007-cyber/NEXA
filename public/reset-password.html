<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <link rel="stylesheet" href="style.css" />
    <script>
      const savedTheme = localStorage.getItem("theme");

      if (savedTheme === "dark") {
        document.documentElement.classList.add("dark-mode");
      }
    </script>
    <script
      src="https://kit.fontawesome.com/be6af1d745.js"
      crossorigin="anonymous"
    ></script>
    <title>Reset password</title>
    <style>
      .subtitle-form {
        font-weight: normal;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 11px;
        color: grey;
      }
    </style>
  </head>
  <body>
    <div class="container-error">
      <img
        src="images/circle-exclamation-solid.png"
        alt="Warning"
        width="25px"
      />
      <span id="error-text"></span>
    </div>
    <div class="container">
      <div
        style="
          display: flex;
          flex-direction: row;
          gap: 10px;
          align-items: center;
          margin-bottom: 30px;
        "
      >
        <div style="display: flex; flex-direction: column">
          <div class="logo"></div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 5px">
          <span class="title">Nexa</span>
          <span class="subtitle-form">Business Management System</span>
        </div>
      </div>
      <span
        class="title"
        style="font-size: 25px; font-weight: normal; margin-bottom: 10px"
        >Recover password</span
      >
      <span class="subtitle" style="font-weight: normal"
        >Enter new password and confirm it</span
      >
      <form id="form">
        <span class="subtitle-form">New password</span>
        <input type="password" required placeholder="•••••••" id="password" />
        <span id="password-error" style="color: red; display: none"></span>
        <span class="subtitle-form">Confirm password</span>
        <input type="password" required placeholder="•••••••" id="password2" />
        <span id="confirm-error" style="color: red; display: none"></span>
      </form>
      <button class="login" id="login">Reset password</button>
    </div>
  </body>
  <script src="../public/config.js"></script>
  <script>
    const password = document.getElementById("password");
    const confirm = document.getElementById("password2");
    const login = document.getElementById("login");
    const password_error = document.getElementById("password-error");
    const confirm_error = document.getElementById("confirm-error");
    const container_error = document.querySelector(".container-error");
    const error_text = document.getElementById("error-text");

    function validaPassword() {
      const passwordValue = password.value.trim();

      if (passwordValue.length < 8) {
        password_error.textContent =
          "La password deve contenere almeno 8 caratteri.";
        password_error.style.display = "block";
        return false;
      }
      if (!/[A-Z]/.test(passwordValue)) {
        password_error.textContent =
          "La password deve contenere almeno una letter maiuscola.";
        password_error.style.display = "block";
        return false;
      }
      if (!/[a-z]/.test(passwordValue)) {
        password_error.textContent =
          "La password deve contenere almeno una lettera minuscola.";
        password_error.style.display = "block";
        return false;
      }
      if (!/\d/.test(passwordValue)) {
        password_error.textContent =
          "La password deve contenere almeno un numero.";
        password_error.style.display = "block";
        return false;
      }
      if (!/[!@#$%^&*()_+=\-[\]{};':",./?]/.test(passwordValue)) {
        password_error.textContent =
          "La password deve contenere almeno un carattere speciale (es. !@#$).";
        password_error.style.display = "block";
        return false;
      }

      password_error.textContent = "";
      password_error.style.display = "none";
      return true;
    }
    function validaConferma() {
      if (confirm.value.trim() !== password.value.trim()) {
        confirm_error.textContent = "Le due password non sono uguali.";
        confirm_error.style.display = "block";
        return false;
      } else {
        confirm_error.textContent = "";
        confirm_error.style.display = "none";
        return true;
      }
    }

    password.addEventListener("input", validaPassword);
    confirm.addEventListener("input", validaConferma);

    container_error.classList.remove("active");
    container_error.classList.remove("success");
    error_text.textContent = "";

    login.addEventListener("click", (e) => {
      e.preventDefault();
      if (!password.value.trim() || !confirm.value.trim()) {
        container_error.classList.add("active");
        error_text.textContent =
          "Il campo password e la conferma sono obbligatori";
        return false;
      }
      const isPasswordValida = validaPassword();
      const isConfermaValida = validaConferma();

      if (!isPasswordValida || !isConfermaValida) {
        container_error.classList.add("active");
        error_text.textContent = "Correggi gli errori prima di inviare";
        return false;
      }

      const urlParams = new URLSearchParams(window.location.search);
      const token = urlParams.get("token");

      const data = {
        password: password.value.trim(),
        token: token,
      };

      fetch(`${API_URL}/api/auth/reset-password2`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
        },
        body: JSON.stringify(data),
      })
        .then((response) => {
          if (!response.ok) {
            return response.json().then((errData) => {
              throw new Error(
                errData.message ||
                  errData.error ||
                  "Errore sconosciuto dal server",
              );
            });
          }
          return response.json();
        })
        .then((data) => {
          return (window.location.href = "/public/confirmed-password.html");
        })
        .catch((error) => {
          console.error("Si è verificato un problema:", error);
          container_error.classList.add("active");
          error_text.textContent = error.message;
          return false;
        });
    });
  </script>
</html>
