<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cloudflare.com" />
    <script>
      const savedTheme = localStorage.getItem("theme");

      if (savedTheme === "dark") {
        document.documentElement.classList.add("dark-mode");
      }
    </script>
    <script
      src="https://kit.fontawesome.com/be6af1d745.js"
      crossorigin="anonymous"
    ></script>
    <title>Confirmed password</title>
    <style>
      .subtitle-form {
        font-weight: normal;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 11px;
        color: grey;
      }
      .card {
        padding: 40px 32px;
        border-radius: 16px;
        box-shadow:
          0 4px 6px -1px rgba(0, 0, 0, 0.05),
          0 10px 15px -3px rgba(0, 0, 0, 0.03);
        border: 1px solid #f1f5f9;
        width: 100%;
        max-width: 440px;
        text-align: center;
      }
      .success-icon-container {
        margin-bottom: 24px;
        display: inline-flex;
        justify-content: center;
        align-items: center;
        width: 80px;
        height: 80px;
        background-color: #f0fdf4;
        border-radius: 50%;
        position: relative;
      }

      /* Effetto pulsazione delicato */
      .success-icon-container::before {
        content: "";
        position: absolute;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        background-color: #bbf7d0;
        opacity: 0.4;
      }

      .success-checkmark {
        width: 40px;
        height: 40px;
        fill: none;
        stroke: #16a34a; /* Verde successo moderno */
        stroke-width: 4;
        stroke-linecap: round;
        stroke-linejoin: round;
        position: relative;
        z-index: 2;
      }

      .status-title {
        font-size: 22px;
        font-weight: 600;
        color: #0f766e; /* Teal/Verde scuro elegante */
        margin-bottom: 12px;
      }

      .status-message {
        font-size: 14px;
        color: #64748b;
        line-height: 1.5;
        margin-bottom: 28px;
      }

      /* Loader / Redirect Indicator */
      .redirect-loader {
        display: inline-block;
        width: 20px;
        height: 20px;
        border: 2px solid #e2e8f0;
        border-radius: 50%;
        border-top-color: #16a34a;
        animation: spin 0.8s linear infinite;
      }

      /* Animations */
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div
        style="
          display: flex;
          flex-direction: row;
          gap: 10px;
          align-items: center;
          margin-bottom: 30px;
        "
      >
        <div style="display: flex; flex-direction: column">
          <div class="logo"></div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 5px">
          <span class="title">Nexa</span>
          <span class="subtitle-form">Business Management System</span>
        </div>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center">
        <div class="success-icon-container">
          <svg class="success-checkmark" viewBox="0 0 24 24">
            <path d="M20 6L9 17l-5-5"></path>
          </svg>
        </div>

        <h2 class="status-title">Password confermata</h2>
        <p class="status-message">
          Verrai reindirizzato automaticamente alla pagina di login.
        </p>

        <div class="redirect-loader"></div>
      </div>
    </div>
  </body>
  <script>
    const provenienza = localStorage.getItem("provenienza");
    setTimeout(() => {
      if (provenienza === "settings") {
        window.location.href = "/public/settings.html";
      } else {
        window.location.href = "/public/login.html";
      }
    }, 5000);
    localStorage.clear();
  </script>
</html>
